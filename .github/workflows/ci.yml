name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 26

      - run: pnpm install --frozen-lockfile

      # `pnpm lint` is `biome check --write`: it repairs the drift and exits 0,
      # so running it here would pass on exactly the code CI exists to reject.
      - name: Lint
        run: pnpm lint:ci

      - name: Spell
        run: pnpm spell

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # `--with-deps` runs `apt-get update` over every source the runner image
      # carries, Google's Chrome repository among them; an index published
      # half-way fails the whole job on a hash mismatch. Playwright ships its
      # own Chromium, so the source goes.
      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google*
          pnpm exec playwright install --with-deps chromium

      - name: Lighthouse
        run: pnpm lighthouse

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          if-no-files-found: ignore

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm dlx wrangler@4 pages deploy dist --project-name pastime --branch main

  # Workflows break at run time: a typo in an expression or a context passes
  # as plain YAML and only fails when the step is reached.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
