<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OG · Planche</title>
<style>@font-face { font-family: Archivo; src: url(../../../public/fonts/archivo-latin.woff2) format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
:root {
  --cover-ink: oklch(17% 0.012 260);
  --day-paper: oklch(98.5% 0.004 240); --day-ink: oklch(20% 0.012 260); --day-desk: oklch(93% 0.006 240);
  --night-paper: oklch(17% 0.008 260); --night-ink: oklch(92% 0.014 95); --night-desk: oklch(13% 0.006 260); --night-soft: oklch(76% 0.012 95);
  --cyan: oklch(73% 0.135 228); --magenta: oklch(63% 0.225 0); --yellow: oklch(88% 0.165 96); --green: oklch(72% 0.15 150);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { display: grid; place-items: center; gap: 16px; background: oklch(30% 0.01 260); font-family: Archivo, system-ui, sans-serif; overflow: hidden; }
.og { position: relative; width: 1200px; height: 630px; overflow: hidden; transform-origin: center; flex: none; }
.caption { position: fixed; left: 16px; bottom: 12px; color: oklch(85% 0.01 260); font: 600 13px/1.3 Archivo, sans-serif; }
.caption a { color: inherit; }
svg { display: block; }
.ink-bar { display: flex; gap: 6px; }
.ink-bar i { width: 30px; height: 20px; }
</style><style>
.og { background: var(--day-paper); color: var(--day-ink); display: grid; grid-template-columns: 1fr 630px; }
.page { padding: 52px 52px 48px; display: flex; flex-direction: column; border-right: 2.5px solid var(--day-ink); }
.ink-bar .p{background:var(--cyan)} .ink-bar .s{background:var(--magenta)} .ink-bar .t{background:var(--yellow)} .ink-bar .d{background:var(--green)} .ink-bar .k{background:var(--day-ink)}
h1 { margin-top: 20px; font-weight: 900; font-stretch: 118%; font-size: 118px; line-height: .86; letter-spacing: -0.035em; }
.rule { margin-top: 18px; padding-top: 6px; border-top: 7px solid var(--day-ink); border-bottom: 2px solid var(--day-ink); }
ol { list-style: none; margin-top: auto; }
li { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid oklch(80% 0.008 250); font-weight: 800; font-stretch: 92%; font-size: 30px; letter-spacing: -0.01em; }
li:last-child { border-bottom: 0; }
li i { width: 22px; height: 22px; flex: none; }
.spread { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; background: var(--day-paper); }
.spread div { position: relative; overflow: hidden; color: var(--cover-ink); }
.spread svg { position: absolute; width: 250px; height: 250px; left: 50%; top: 50%; translate: -42% -42%; }
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <mask id="pipes-channel" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect fill="white" height="48" width="48"/><path d="M8 24H24V4M24 24V44" fill="none" stroke="black" stroke-width="5.5"/><circle cx="8" cy="24" fill="black" r="4"/></mask>
    <mask id="solitaire-front" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect fill="white" height="48" width="48"/><rect height="33" rx="3" width="24" x="18" y="7" fill="black" stroke="black" stroke-width="2.6"/></mask>
    <symbol id="g-pipes" viewBox="0 0 48 48"><g fill="currentColor" mask="url(#pipes-channel)"><path d="M8 24H24V4M24 24V44" fill="none" stroke="currentColor" stroke-width="13"/><circle cx="8" cy="24" r="8"/></g></symbol>
    <symbol id="g-solitaire" viewBox="0 0 48 48"><g mask="url(#solitaire-front)"><rect fill="currentColor" height="33" rx="3" transform="rotate(-12 17 25)" width="24" x="5" y="9"/></g><rect height="33" rx="3" width="24" x="18" y="7" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M12 2.2s-8.2 5.7-9.5 10.2c-.9 3 1.1 5.6 4 5.6 1.9 0 3.3-1 4.2-2.3-.3 2.4-1.2 4.2-2.8 5.5h8.2c-1.6-1.3-2.5-3.1-2.8-5.5.9 1.3 2.3 2.3 4.2 2.3 2.9 0 4.9-2.6 4-5.6C20.2 7.9 12 2.2 12 2.2z" fill="currentColor" transform="translate(22 15) scale(0.667)"/></symbol>
    <symbol id="g-stars" viewBox="0 0 48 48"><path d="M24 6V42M6 24H42" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 24H24V42" fill="none" stroke="currentColor" stroke-width="4"/><rect fill="none" height="36" stroke="currentColor" stroke-width="4" width="36" x="6" y="6"/><polygon fill="currentColor" points="33,8.5 34.7,13.2 39.7,13.3 35.8,16.4 37.1,21.2 33,18.4 28.9,21.2 30.2,16.4 26.3,13.3 31.3,13.2"/><path d="M10.5 28.5l6 6M16.5 28.5l-6 6" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/></symbol>
    <symbol id="g-dots" viewBox="0 0 48 48"><path d="M9 39L24 24L39 39M24 24V9" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="9" fill="currentColor" r="6.5"/><circle cx="9" cy="39" fill="none" r="6" stroke="currentColor" stroke-width="3"/><circle cx="39" cy="39" fill="currentColor" r="6.5"/><circle cx="24" cy="24" fill="none" r="5" stroke="currentColor" stroke-width="3"/></symbol>
  </defs>
</svg>

<div class="og">
  <div class="page">
    <div class="ink-bar"><i class="p"></i><i class="s"></i><i class="t"></i><i class="d"></i><i class="k"></i></div>
    <h1>Pastime</h1>
    <div class="rule"></div>
    <ol>
      <li><i style="background:var(--yellow)"></i>Étoiles</li>
      <li><i style="background:var(--cyan)"></i>Tuyaux</li>
      <li><i style="background:var(--magenta)"></i>Solitaire</li>
      <li><i style="background:var(--green)"></i>Color Dots</li>
    </ol>
  </div>
  <div class="spread">
    <div style="background:var(--yellow)"><svg><use href="#g-stars"/></svg></div>
    <div style="background:var(--cyan)"><svg><use href="#g-pipes"/></svg></div>
    <div style="background:var(--magenta)"><svg><use href="#g-solitaire"/></svg></div>
    <div style="background:var(--green)"><svg><use href="#g-dots"/></svg></div>
  </div>
</div>
<p class="caption"><a href="couverture.html">A</a> · B · Planche — de jour : la page de titre à gauche, les quatre couvertures en carré à droite. <a href="bandes.html">C</a></p>
<script>const card = document.querySelector('.og')
const fit = () => { card.style.scale = Math.min(1, (innerWidth - 32) / 1200, (innerHeight - 80) / 630) }
fit(); addEventListener('resize', fit)
if (new URLSearchParams(location.search).has('export')) { document.querySelector('.caption')?.remove(); card.style.scale = 1; document.body.style.display = 'block' }
</script></body></html>
