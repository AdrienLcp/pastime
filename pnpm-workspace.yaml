allowBuilds:
  '@parcel/watcher': true
  esbuild: true

engineStrict: true

# A release younger than a day is not installed: most hijacked npm versions
# are pulled within hours. Pin the previous version when a fresh one is needed.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@adrienlcp/*'

# vite-plugin-pwa still passes Rolldown the deprecated `inlineDynamicImports`
# when it bundles the service worker; the patch switches it to `codeSplitting`.
patchedDependencies:
  vite-plugin-pwa@2.0.0: patches/vite-plugin-pwa@2.0.0.patch

publicHoistPattern:
  - '@biomejs/*'
