<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <meta content="Casse-têtes et jeux de cartes en solo, sans pub ni compte, jouables hors ligne. Chaque niveau se résout sans deviner." name="description" />
    <meta content="Pastime" property="og:site_name" />
    <meta content="Pastime" property="og:title" />
    <meta content="Casse-têtes et jeux de cartes en solo, sans pub ni compte, jouables hors ligne. Chaque niveau se résout sans deviner." property="og:description" />
    <meta content="website" property="og:type" />
    <meta content="https://pastime.adrienlcp.com/" property="og:url" />
    <meta content="fr_FR" property="og:locale" />
    <meta content="en_US" property="og:locale:alternate" />
    <meta content="https://pastime.adrienlcp.com/og-image.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="630" property="og:image:height" />
    <meta content="Pastime, imprimé sous quatre bandes d’encre : cyan, magenta, jaune et vert." property="og:image:alt" />
    <meta content="summary_large_image" name="twitter:card" />
    <!-- The paper in each book (--paper in _tokens.sass); the manifest holds the night one, and its test checks they agree. -->
    <meta content="#f8fafd" data-scheme="light" media="(prefers-color-scheme: light)" name="theme-color" />
    <meta content="#0d1013" data-scheme="dark" media="(prefers-color-scheme: dark)" name="theme-color" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="/icons/apple-touch-icon.png" rel="apple-touch-icon" />
    <link as="font" crossorigin href="/fonts/archivo-latin.woff2" rel="preload" type="font/woff2" />
    <title>Pastime</title>
    <meta content="website" property="og:type" />
    <meta content="Pastime" property="og:title" />
    <meta content="Small solo puzzle and card games in one app: no ads, no account, works offline." property="og:description" />
    <meta content="https://pastime.adrienlcp.com/" property="og:url" />
    <meta content="fr_FR" property="og:locale" />
    <meta content="en_US" property="og:locale:alternate" />
    <meta content="summary_large_image" name="twitter:card" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pastime",
        "url": "https://pastime.adrienlcp.com/",
        "description": "Small solo puzzle and card games in one app: no ads, no account, works offline.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "inLanguage": ["fr", "en"]
      }
    </script>
    <!--
      A layer's position is fixed where its name first appears, and Vite injects
      stylesheets in module-graph order: declared here, the order cannot depend
      on which component happened to be imported first.
    -->
    <style>
      @layer reset, tokens, base, components;
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
